services:
  # ── PostgreSQL Database ──────────────────────────────
  - type: pgo
    name: facilityops-db
    plan: free
    databaseName: facilityops_db
    user: facilityops_user

  # ── Redis Cache ────────────────────────────────────────
  - type: redis
    name: facilityops-redis
    plan: free

  # ── FastAPI Backend ────────────────────────────────────
  - type: web
    name: facilityops-backend
    env: docker
    region: oregon
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: facilityops-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: facilityops-redis
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: REDIS_ENABLED
        value: "true"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["*"]' # Allows the frontend to connect from its Render URL

  # ── React Frontend ──────────────────────────────────────
  - type: web
    name: facilityops-frontend
    env: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: ./frontend
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: facilityops-backend
          envVarKey: RENDER_EXTERNAL_URL
