version: '3.9'

# ─────────────────────────────────────────────────────────────────────────────
#  Agentic AI For Smart Facility Operations And Optimizations — Docker Compose
#  Starts: Backend · Frontend · PostgreSQL · Redis
#  Usage:  docker compose up --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: facilityops_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-facilityops_db}
      POSTGRES_USER:     ${POSTGRES_USER:-facilityops_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facilityops_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-facilityops_user} -d ${POSTGRES_DB:-facilityops_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - facilityops_net

  # ── Redis Cache ────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: facilityops_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_pass}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - facilityops_net

  # ── FastAPI Backend ────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: facilityops_backend
    restart: unless-stopped
    environment:
      ENVIRONMENT:                    production
      DATABASE_URL:                   postgresql://${POSTGRES_USER:-facilityops_user}:${POSTGRES_PASSWORD:-facilityops_pass}@postgres:5432/${POSTGRES_DB:-facilityops_db}
      REDIS_URL:                      redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
      REDIS_ENABLED:                  "true"
      JWT_SECRET_KEY:                 ${JWT_SECRET_KEY:-change-this-in-production}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CORS_ORIGINS:                   '["http://localhost:5173","http://localhost:3000","http://frontend:5173"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/ml_models:/app/ml_models
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - facilityops_net

  # ── React Frontend ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: facilityops_frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000/api
      VITE_APP_NAME: "Agentic AI For Smart Facility Operations And Optimizations"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - facilityops_net

  # ── Celery Worker ──────────────────────────────────────────────────────────
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: facilityops_worker
    restart: unless-stopped
    command: ["celery", "-A", "app.workers.report_worker.celery_app", "worker", "--loglevel=info"]
    environment:
      ENVIRONMENT:                    production
      DATABASE_URL:                   postgresql://${POSTGRES_USER:-facilityops_user}:${POSTGRES_PASSWORD:-facilityops_pass}@postgres:5432/${POSTGRES_DB:-facilityops_db}
      REDIS_URL:                      redis://:${REDIS_PASSWORD:-redis_pass}@redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - facilityops_net

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    name: facilityops_postgres_data
  redis_data:
    name: facilityops_redis_data

# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  facilityops_net:
    driver: bridge
    name: facilityops_network
